spring.application.name=account-service
server.port=8081
management.endpoints.web.exposure.include=health,info

# Discovery: override EUREKA_URL when running in containers.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health
eureka.client.healthcheck.enabled=true

# Local file database survives service restarts; override URL for other environments.
spring.datasource.url=${ACCOUNT_DB_URL:jdbc:h2:file:./data/accounts;WRITE_DELAY=0}
spring.datasource.username=${ACCOUNT_DB_USERNAME:sa}
spring.datasource.password=${ACCOUNT_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
