spring.application.name=assistant-service
server.port=8083
management.endpoints.web.exposure.include=health,info
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.ai.openai.api-key=${GEMINI_API_KEY}

# Discovery: override EUREKA_URL when running in containers.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health
eureka.client.healthcheck.enabled=true

# Gemini exposes an OpenAI-compatible API; requests go directly to Google.
spring.ai.openai.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=4096
spring.ai.model.embedding=none
spring.ai.retry.max-attempts=1
spring.mvc.problemdetails.enabled=true

spring.ai.mcp.client.name=bank-assistant
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=20s
spring.ai.mcp.client.sse.connections.accounts.url=${ACCOUNT_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.sse.connections.transactions.url=${TRANSACTION_MCP_URL:http://localhost:8082}
