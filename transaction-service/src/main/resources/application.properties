spring.application.name=transaction-service
server.port=8082
management.endpoints.web.exposure.include=health,info
spring.config.import=${CONFIG_IMPORT:configserver:${CONFIG_SERVER_URL:http://localhost:8888}}

# Discovery: override EUREKA_URL when running in containers.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health
eureka.client.healthcheck.enabled=true

spring.datasource.url=${TRANSACTION_DB_URL:jdbc:h2:file:./data/transactions;WRITE_DELAY=0}
spring.datasource.username=${TRANSACTION_DB_USERNAME:sa}
spring.datasource.password=${TRANSACTION_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# Empty URL uses Eureka; set ACCOUNT_SERVICE_URL for direct local calls.
bank.account-service.url=${ACCOUNT_SERVICE_URL:}
spring.cloud.openfeign.client.config.account-service.connectTimeout=1000
spring.cloud.openfeign.client.config.account-service.readTimeout=2000
spring.cloud.loadbalancer.retry.enabled=false

# Only safe reads are decorated by this circuit breaker and retry.
resilience4j.circuitbreaker.instances.accountReads.sliding-window-size=6
resilience4j.circuitbreaker.instances.accountReads.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.accountReads.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountReads.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accountReads.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.accountReads.record-exceptions=feign.RetryableException,feign.FeignException$InternalServerError,feign.FeignException$ServiceUnavailable,feign.FeignException$BadGateway,feign.FeignException$GatewayTimeout
resilience4j.retry.instances.accountReads.max-attempts=3
resilience4j.retry.instances.accountReads.wait-duration=100ms
resilience4j.retry.instances.accountReads.retry-exceptions=feign.RetryableException,feign.FeignException$InternalServerError,feign.FeignException$ServiceUnavailable,feign.FeignException$BadGateway,feign.FeignException$GatewayTimeout

spring.graphql.graphiql.enabled=true
spring.ai.mcp.server.name=transaction-service
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
